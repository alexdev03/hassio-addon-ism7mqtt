name: "Ism7MQTT (pinned image)"
description: "ism7mqtt built from a pinned upstream tag + merged PR #211 (race fix) and WolfLink sidfix"
version: "1.1.0"
slug: "ism7mqtt-pinned"
init: false
url: https://github.com/alexdev03/hassio-addon-ism7mqtt
arch:
  - aarch64
  - amd64
map:
  - "config:rw"
discovery:
  - mqtt
services:
  - "mqtt:need"

options:
  device_name: Wolf
  language: "DEU: German"
  interval: 60
  additional_devices: []
  debug_logging: false
  mqtt_port: 1883

schema:
  device_name: str
  ism7_ip: str
  ism7_password: password
  language: "list(DEU: German|CHN: Chinese simplified|GRC: Greek|EST: Estonian|HRV: Croatian|LVA: Latvian|LTU: Lithuanian|ROU: Romanian|ITA: Italian|ESP: Spanish|FRA: French|POL: Polish|CZE: Czech|SVK: Slovak|RUS: Russian|DNK: Danish|HUN: Hungarian|GBR: English|TUR: Turkish|NLD: Dutch|BUL: Bulgarian|POR: Portuguese)"
  interval: int
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_user: "str?"
  mqtt_password: "password?"
  debug_logging: bool
  additional_devices:
    - device_name: str
      ism7_ip: str
      ism7_password: password
      interval: "int?"
